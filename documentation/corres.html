<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Corres — Cross-Generational Knowledge Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
:root{
  --ink-900:#0B1F3A; --ink-800:#123058; --ink-700:#1B4477; --ink-600:#265998;
  --brass-500:#C9A227; --brass-600:#A2811C; --brass-100:#F5EAC7;
  --paper-0:#FFFFFF; --paper-50:#F6F5F1; --paper-100:#EDEBE2; --paper-200:#E1DDCF;
  --sage-500:#3F6F5C; --sage-100:#DCEAE3;
  --rust-500:#AE4F3B; --rust-100:#F3DFDA;
  --slate-500:#5B6B7A; --slate-300:#93A0AC;
  --border:#DFDBCF; --text-900:#182430; --text-600:#535F6B; --text-400:#8993A0;
  --r-sm:8px; --r-md:14px; --r-lg:22px;
  --font-d:'Fraunces',Georgia,'Times New Roman',serif;
  --font-b:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --shadow-1: 0 1px 2px rgba(14,27,44,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper-0:#111925; --paper-50:#0B121B; --paper-100:#161F2C; --paper-200:#1E2836;
    --border:#263242; --text-900:#EBEEF2; --text-600:#A7B1BD; --text-400:#71808F;
    --brass-100:#3A331F; --sage-100:#16281F; --rust-100:#301A15;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper-0:#111925; --paper-50:#0B121B; --paper-100:#161F2C; --paper-200:#1E2836;
  --border:#263242; --text-900:#EBEEF2; --text-600:#A7B1BD; --text-400:#71808F;
  --brass-100:#3A331F; --sage-100:#16281F; --rust-100:#301A15;
  color-scheme: dark;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-b); background:var(--paper-50); color:var(--text-900);
  -webkit-font-smoothing:antialiased;
}
#root{min-height:100vh;}
img{max-width:100%;display:block;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

h1,h2,h3,h4{font-family:var(--font-d); margin:0; color:var(--text-900); font-weight:600;}
p{margin:0;}

.app-shell{display:flex; min-height:100vh;}

/* ---------- Sidebar ---------- */
.sidebar{
  width:264px; flex-shrink:0; background:var(--ink-900); color:#EDEFF3;
  display:flex; flex-direction:column; padding:26px 18px 18px;
  position:sticky; top:0; height:100vh;
}
.brand{display:flex; align-items:center; gap:10px; padding:0 6px 22px; border-bottom:1px solid rgba(255,255,255,.08); margin-bottom:18px;}
.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(160deg,var(--brass-500),var(--brass-600));display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:700;color:#1B140A;font-size:16px;flex-shrink:0;}
.brand-name{font-family:var(--font-d); font-size:19px; font-weight:600; color:#fff; line-height:1.1;}
.brand-sub{font-size:11px; color:#93A2B4; letter-spacing:.02em;}

.nav-list{display:flex; flex-direction:column; gap:2px; flex:1; overflow-y:auto;}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:10px;
  color:#B9C3D1; background:transparent; border:none; text-align:left; width:100%;
  font-size:14.5px; font-weight:500; transition:background .12s ease, color .12s ease;
}
.nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.nav-item.active{background:rgba(184,134,59,.18); color:#fff;}
.nav-item.active .nav-ic{color:var(--brass-500);}
.nav-ic{width:19px;height:19px;flex-shrink:0;color:#8FA0B4;}
.nav-item.active .nav-ic, .nav-item:hover .nav-ic{color:inherit;}

.sidebar-foot{border-top:1px solid rgba(255,255,255,.08); padding-top:14px; margin-top:10px;}
.role-preview{background:rgba(255,255,255,.05); border-radius:12px; padding:10px 12px; margin-bottom:12px;}
.role-preview-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:#7C8AA0; margin-bottom:8px;}
.role-seg{display:flex; gap:4px; background:rgba(0,0,0,.25); border-radius:9px; padding:3px;}
.role-seg button{flex:1; border:none; background:transparent; color:#9AA7B8; font-size:12px; font-weight:600; padding:7px 4px; border-radius:7px;}
.role-seg button.active{background:#fff; color:var(--ink-900);}
.user-chip{display:flex; align-items:center; gap:10px; padding:8px 6px;}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
.user-chip .avatar{background:var(--brass-100); color:var(--brass-600);}
.user-chip-name{font-size:13.5px; font-weight:600; color:#fff;}
.user-chip-meta{font-size:11.5px; color:#8A98AC;}

/* ---------- Topbar / content ---------- */
.main-col{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:16px 32px; border-bottom:1px solid var(--border); background:var(--paper-0);
  position:sticky; top:0; z-index:5;
}
.topbar-title{font-family:var(--font-d); font-size:21px; font-weight:600;}
.topbar-right{display:flex; align-items:center; gap:14px;}
.icon-btn{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--paper-0);
  display:flex;align-items:center;justify-content:center;color:var(--text-600); position:relative;
}
.icon-btn .dot{position:absolute; top:6px; right:6px; width:7px;height:7px;border-radius:50%;background:var(--rust-500); border:1.5px solid var(--paper-0);}
.menu-btn{display:none;}

.content{padding:28px 32px 100px; max-width:1180px; width:100%; margin:0 auto;}

/* ---------- Generic components ---------- */
.icon{width:1em;height:1em; display:inline-block; vertical-align:-0.14em;}
.eyebrow{color:var(--text-600); font-size:13.5px; margin-bottom:4px;}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap;}
.page-head h1{font-size:28px;}
.subhead{color:var(--text-600); font-size:14.5px; margin-top:6px; max-width:60ch;}

.btn{
  display:inline-flex; align-items:center; gap:8px; border-radius:10px; padding:10px 16px;
  font-size:14px; font-weight:600; border:1px solid transparent; white-space:nowrap;
}
.btn-primary{background:var(--ink-900); color:#fff;}
.btn-primary:hover{background:var(--ink-800);}
.btn-brass{background:var(--brass-500); color:#241A08;}
.btn-brass:hover{background:var(--brass-600); color:#fff;}
.btn-ghost{background:transparent; border-color:var(--border); color:var(--text-900);}
.btn-ghost:hover{background:var(--paper-100);}
.btn-sm{padding:7px 12px; font-size:13px; border-radius:8px;}

.card{background:var(--paper-0); border:1px solid var(--border); border-radius:var(--r-md); padding:20px;}
.grid{display:grid; gap:16px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

.badge{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:4px 9px; border-radius:99px; letter-spacing:.01em;}
.badge-sage{background:var(--sage-100); color:var(--sage-500);}
.badge-brass{background:var(--brass-100); color:var(--brass-600);}
.badge-rust{background:var(--rust-100); color:var(--rust-500);}
.badge-slate{background:var(--paper-100); color:var(--text-600);}

.stat-card{background:var(--paper-0); border:1px solid var(--border); border-radius:var(--r-md); padding:18px 20px;}
.stat-num{font-family:var(--font-d); font-size:28px; font-weight:600;}
.stat-label{color:var(--text-600); font-size:13px; margin-top:4px;}

.empty{border:1px dashed var(--border); border-radius:var(--r-md); padding:40px 24px; text-align:center; color:var(--text-600);}
.empty .icon{width:30px;height:30px; color:var(--text-400); margin-bottom:10px;}
.empty-title{color:var(--text-900); font-weight:600; margin-bottom:4px; font-family:var(--font-d); font-size:16px;}

.skeleton{background:linear-gradient(90deg,var(--paper-100) 25%,var(--paper-200) 37%,var(--paper-100) 63%); background-size:400% 100%; animation:sk 1.4s ease infinite; border-radius:8px;}
@keyframes sk{0%{background-position:100% 50%;}100%{background-position:0 50%;}}

.divider{height:1px; background:var(--border); margin:18px 0;}
.input, select, textarea.ta{
  width:100%; border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:14px;
  background:var(--paper-0); color:var(--text-900); font-family:inherit;
}
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px;}
.field label{font-size:13px; font-weight:600; color:var(--text-700,var(--text-900));}
.search-bar{display:flex; align-items:center; gap:8px; border:1px solid var(--border); border-radius:10px; padding:9px 12px; background:var(--paper-0); color:var(--text-600);}
.search-bar input{border:none; outline:none; background:transparent; flex:1; font-size:14px; color:var(--text-900);}

.tab-row{display:flex; gap:6px; border-bottom:1px solid var(--border); margin-bottom:20px; overflow-x:auto;}
.tab-btn{padding:10px 4px; margin-right:20px; border:none; background:transparent; font-weight:600; font-size:14px; color:var(--text-600); border-bottom:2px solid transparent; white-space:nowrap;}
.tab-btn.active{color:var(--text-900); border-color:var(--brass-500);}

.chip{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border); border-radius:99px; padding:6px 12px; font-size:12.5px; font-weight:600; color:var(--text-600); background:var(--paper-0);}
.chip.active{background:var(--ink-900); border-color:var(--ink-900); color:#fff;}

table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; color:var(--text-600); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.04em; padding:10px 14px; border-bottom:1px solid var(--border);}
td{padding:13px 14px; border-bottom:1px solid var(--border); vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--r-md);}
.table-wrap table{min-width:640px;}

/* ---------- Login / onboarding ---------- */
.auth-shell{min-height:100vh; display:flex;}
.auth-visual{flex:1; background:radial-gradient(circle at 25% 20%, #8A1B33 0%, var(--ink-900) 55%, #2B0710 100%); color:#fff; padding:60px; display:flex; flex-direction:column; justify-content:space-between; position:relative; overflow:hidden;}
.auth-visual .lineage-deco{position:absolute; right:-40px; bottom:-40px; opacity:.5;}
.auth-form-side{width:460px; flex-shrink:0; display:flex; align-items:center; justify-content:center; padding:40px; background:var(--paper-0);}
@media (max-width:860px){.auth-visual{display:none;} .auth-form-side{width:100%;}}
.auth-box{width:100%; max-width:360px;}
.gen-line{display:flex; align-items:center; gap:12px; font-size:14px; color:#C7D2E0; padding:8px 0;}
.gen-dot{width:9px;height:9px;border-radius:50%; background:var(--brass-500); flex-shrink:0;}

/* ---------- Corres / lineage ---------- */
.corres-card{border:1px solid var(--border); border-radius:var(--r-lg); overflow:hidden; background:var(--paper-0);}
.corres-card-top{padding:22px 24px; display:flex; gap:16px; align-items:flex-start; border-left:5px solid var(--brass-500);}
.corres-avatar{width:58px;height:58px;border-radius:14px;background:var(--ink-900);color:#EFE2C4;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:20px;font-weight:600;flex-shrink:0;}
.corres-card-foot{display:flex; border-top:1px solid var(--border);}
.corres-card-foot button{flex:1; padding:14px; border:none; background:transparent; font-weight:600; font-size:13.5px; display:flex; align-items:center; justify-content:center; gap:7px;}
.corres-card-foot button+button{border-left:1px solid var(--border);}

.lineage{position:relative; padding-left:28px;}
.lineage::before{content:'';position:absolute; left:9px; top:6px; bottom:6px; width:2px; background:var(--border);}
.lineage-node{position:relative; padding:0 0 26px 20px; cursor:pointer;}
.lineage-node::before{content:''; position:absolute; left:-28px; top:2px; width:14px; height:14px; border-radius:50%; background:var(--paper-0); border:3px solid var(--slate-300);}
.lineage-node.you::before{border-color:var(--brass-500); background:var(--brass-500);}
.lineage-node.selected::before{border-color:var(--sage-500); background:var(--sage-500);}
.lineage-node:last-child{padding-bottom:0;}
.lineage-card{border:1px solid var(--border); border-radius:12px; padding:14px 16px; background:var(--paper-0);}
.lineage-card:hover{border-color:var(--brass-500);}

/* ---------- Resource card ---------- */
.res-card{border:1px solid var(--border); border-radius:var(--r-md); padding:17px; background:var(--paper-0); display:flex; flex-direction:column; gap:10px;}
.res-top{display:flex; justify-content:space-between; gap:10px; align-items:flex-start;}
.res-icon{width:38px;height:38px;border-radius:10px;background:var(--paper-100);display:flex;align-items:center;justify-content:center;color:var(--ink-700); flex-shrink:0;}
.res-title{font-weight:600; font-size:15px; line-height:1.3;}
.res-meta{color:var(--text-600); font-size:12.5px;}
.res-tags{display:flex; flex-wrap:wrap; gap:6px;}
.tag{font-size:11px; font-weight:600; color:var(--text-600); background:var(--paper-100); padding:3px 8px; border-radius:99px;}
.res-actions{display:flex; gap:8px; margin-top:auto; padding-top:6px;}
.res-actions .btn{flex:1; justify-content:center;}

/* ---------- Q&A ---------- */
.q-card{border:1px solid var(--border); border-radius:var(--r-md); padding:17px 18px; background:var(--paper-0); display:flex; gap:14px; cursor:pointer;}
.q-stat{width:50px; text-align:center; flex-shrink:0;}
.q-stat b{display:block; font-size:16px; font-family:var(--font-d);}
.q-stat span{font-size:10.5px; color:var(--text-600); text-transform:uppercase;}
.answer-box{border:1px solid var(--border); border-radius:12px; padding:15px 16px; background:var(--paper-0);}
.answer-box.accepted{border-color:var(--sage-500); background:var(--sage-100);}

/* ---------- Chat ---------- */
.chat-shell{display:grid; grid-template-columns:290px 1fr; border:1px solid var(--border); border-radius:var(--r-lg); overflow:hidden; height:calc(100vh - 190px); min-height:460px; background:var(--paper-0);}
@media (max-width:760px){.chat-shell{grid-template-columns:1fr; height:auto;}}
.conv-list{border-right:1px solid var(--border); overflow-y:auto;}
.conv-item{display:flex; gap:10px; padding:13px 16px; border-bottom:1px solid var(--border); align-items:center;}
.conv-item.active{background:var(--paper-100);}
.conv-name{font-weight:600; font-size:14px;}
.conv-preview{font-size:12.5px; color:var(--text-600); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:170px;}
.chat-window{display:flex; flex-direction:column; min-height:0;}
.chat-head{display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--border);}
.chat-body{flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:10px;}
.bubble{max-width:65%; padding:10px 14px; border-radius:14px; font-size:14px; line-height:1.4;}
.bubble.me{align-self:flex-end; background:var(--ink-900); color:#fff; border-bottom-right-radius:3px;}
.bubble.them{align-self:flex-start; background:var(--paper-100); border-bottom-left-radius:3px;}
.bubble-time{font-size:10.5px; opacity:.6; margin-top:4px;}
.typing-row{align-self:flex-start; font-size:12.5px; color:var(--text-600); font-style:italic;}
.chat-input{display:flex; gap:10px; padding:14px 16px; border-top:1px solid var(--border);}
.chat-input input{flex:1; border:1px solid var(--border); border-radius:99px; padding:11px 16px; font-size:14px; background:var(--paper-50);}

/* ---------- Contribution / streak ---------- */
.streak-band{display:flex; align-items:center; gap:14px; background:linear-gradient(120deg,var(--ink-900),var(--ink-700)); color:#fff; border-radius:var(--r-lg); padding:20px 24px;}
.streak-flame{width:46px;height:46px;border-radius:12px;background:rgba(184,134,59,.25); display:flex;align-items:center;justify-content:center; color:var(--brass-500); flex-shrink:0;}
.cal-grid{display:grid; grid-template-columns:repeat(14,1fr); gap:5px;}
.cal-cell{aspect-ratio:1; border-radius:4px; background:var(--paper-100);}
.cal-cell.l1{background:var(--sage-100);}
.cal-cell.l2{background:#9BC3B0;}
.cal-cell.l3{background:var(--sage-500);}

/* ---------- Notifications ---------- */
.notif-item{display:flex; gap:13px; padding:15px 4px; border-bottom:1px solid var(--border);}
.notif-item:last-child{border-bottom:none;}
.notif-ic{width:36px;height:36px;border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.notif-time{font-size:12px; color:var(--text-400); white-space:nowrap;}

/* ---------- Mobile bottom nav ---------- */
.bottom-nav{display:none;}
@media (max-width:860px){
  .sidebar{display:none;}
  .sidebar.open{display:flex; position:fixed; inset:0 auto 0 0; z-index:50; width:78vw; max-width:300px; box-shadow:0 0 0 100vw rgba(0,0,0,.4);}
  .menu-btn{display:flex;}
  .content{padding:20px 16px 90px;}
  .topbar{padding:14px 16px;}
  .bottom-nav{display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--paper-0); border-top:1px solid var(--border); z-index:20; padding:6px 4px 8px;}
  .bottom-nav button{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; color:var(--text-400); font-size:10.5px; padding:6px 2px;}
  .bottom-nav button.active{color:var(--ink-900);}
  .bottom-nav .nav-ic{width:20px;height:20px;}
}
.hint-banner{display:flex; gap:12px; align-items:flex-start; background:var(--brass-100); border:1px solid var(--brass-500); border-radius:var(--r-md); padding:14px 16px; margin-bottom:22px; color:var(--ink-900); font-size:13.5px;}
.hint-banner b{display:block; font-size:14px; margin-bottom:2px;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState, useMemo, useEffect, useRef} = React;

    help: <><circle {...p} cx="12" cy="12" r="9"/><path {...p} d="M9.5 9.3a2.5 2.5 0 1 1 3.6 2.2c-.9.5-1.4 1-1.4 2.1"/><circle cx="12" cy="16.7" r="1" fill="currentColor" stroke="none"/></>,
    message: <><path {...p} d="M3.5 5.5h17v11h-9L7 20v-3.5H3.5Z"/></>,

function Badge({tone="slate", icon, children}){
  return <span className={"badge badge-"+tone}>{icon && <Icon name={icon}/>}{children}</span>;
}
function Empty({icon="book", title, body}){
  return <div className="empty"><Icon name={icon}/><div className="empty-title">{title}</div><div>{body}</div></div>;
}
function PageHead({eyebrow, title, subhead, action}){
  return (
    <div className="page-head">
      <div>
        {eyebrow && <div className="eyebrow">{eyebrow}</div>}
        <h1>{title}</h1>
        {subhead && <div className="subhead">{subhead}</div>}
      </div>
      {action}
    </div>
  );
}
function StatCard({num, label}){
  return <div className="stat-card"><div className="stat-num">{num}</div><div className="stat-label">{label}</div></div>;
}
function Avatar({initials, size=40, tone}){
  const style = {width:size, height:size, borderRadius: size>44?14:"50%", fontSize:size*0.36};
  return <div className="avatar" style={{...style, background: tone||"var(--brass-100)", color: tone?"#fff":"var(--brass-600)"}}>{initials}</div>;
}
function AssignmentBadge({type}){
  return type==="SAME_ROLL"
    ? <Badge tone="sage" icon="check">Same Roll Number</Badge>
    : <Badge tone="brass" icon="star">Top Performer Fallback</Badge>;
}
function ResIcon({type}){
  const n = type==="link" ? "branch" : type==="image" ? "star" : "book";
  return <div className="res-icon"><Icon name={n}/></div>;
}

function ChatScreen(){
  const [activeId, setActiveId] = useState(CONVERSATIONS[0].id);
  const [msgsById, setMsgsById] = useState(()=>Object.fromEntries(CONVERSATIONS.map(c=>[c.id,c.messages])));
  const [draft, setDraft] = useState("");
  const [typing, setTyping] = useState(false);
  const active = CONVERSATIONS.find(c=>c.id===activeId);
  const bodyRef = useRef(null);
  useEffect(()=>{ if(bodyRef.current) bodyRef.current.scrollTop = bodyRef.current.scrollHeight; },[msgsById, typing, activeId]);
  const send = ()=>{
    if(!draft.trim()) return;
    setMsgsById(m=>({...m, [activeId]:[...m[activeId], {me:true, text:draft, time:"now"}]}));
    setDraft("");
    setTyping(true);
    setTimeout(()=>{
      setTyping(false);
      setMsgsById(m=>({...m, [activeId]:[...m[activeId], {me:false, text:"Got it — will get back to you shortly.", time:"now"}]}));
    }, 1400);
  };
  return (
    <div>
      <PageHead title="Chat" subhead="Direct line to your assigned Corres."/>
      <div className="chat-shell">
        <div className="conv-list">
          {CONVERSATIONS.map(c=>(
            <div className={"conv-item "+(c.id===activeId?"active":"")} key={c.id} onClick={()=>setActiveId(c.id)} style={{cursor:"pointer"}}>
              <Avatar initials={c.name.split(" ").map(s=>s[0]).join("")} size={40} tone="var(--ink-900)"/>
              <div style={{flex:1, minWidth:0}}>
                <div style={{display:"flex", justifyContent:"space-between"}}><span className="conv-name">{c.name}</span><span style={{fontSize:11, color:"var(--text-400)"}}>{c.time}</span></div>
                <div className="conv-preview">{c.last}</div>
              </div>
            </div>
          ))}
        </div>
        <div className="chat-window">
          <div className="chat-head">
            <Avatar initials={active.name.split(" ").map(s=>s[0]).join("")} size={38} tone="var(--ink-900)"/>
            <div><div style={{fontWeight:700, fontSize:14.5}}>{active.name}</div><div style={{fontSize:12, color:"var(--text-600)"}}>{active.role}</div></div>
          </div>
          <div className="chat-body" ref={bodyRef}>
            {msgsById[activeId].length===0 ? <Empty icon="message" title="Start a conversation with your Corres." body="Say hello — they were assigned to help."/> :
              msgsById[activeId].map((m,i)=>(
                <div key={i} className={"bubble "+(m.me?"me":"them")}>{m.text}<div className="bubble-time">{m.time}</div></div>
              ))}
            {typing && <div className="typing-row">{active.name.split(" ")[0]} is typing…</div>}
          </div>
          <div className="chat-input">
            <input placeholder="Type a message..." value={draft} onChange={e=>setDraft(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()}/>
            <button className="btn btn-primary" style={{borderRadius:99, width:42, height:42, padding:0, justifyContent:"center"}} onClick={send}><Icon name="send"/></button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================= APP SHELL ============================= */
function Sidebar({role, screen, setScreen, setRole, mobileOpen, setMobileOpen}){
  const items = NAV[role];
  return (
    <aside className={"sidebar "+(mobileOpen?"open":"")}>
      <div className="brand">
        <div className="brand-mark">C</div>
        <div><div className="brand-name">Corres</div><div className="brand-sub">Knowledge across generations</div></div>
      </div>
      <div className="nav-list">
        {items.map(it=>(
          <button key={it.key} className={"nav-item "+(screen===it.key?"active":"")} onClick={()=>{setScreen(it.key); setMobileOpen(false);}}>
            <Icon name={it.icon} className="nav-ic"/>{it.label}
          </button>
        ))}
      </div>
      <div className="sidebar-foot">
        <div className="role-preview">
          <div className="role-preview-label">Previewing as</div>
          <div className="role-seg">
            {["student","senior","admin"].map(r=>(
              <button key={r} className={role===r?"active":""} onClick={()=>{setRole(r); setScreen("dashboard");}}>{r[0].toUpperCase()+r.slice(1)}</button>
            ))}
          </div>
        </div>
        <div className="user-chip">
          <Avatar initials={role==="admin"?"AD":role==="senior"?"PM":"AK"} size={36}/>
          <div><div className="user-chip-name">{role==="admin"?"Admin User":role==="senior"?"Priya Menon":"Ak"}</div><div className="user-chip-meta">{role==="admin"?"Administrator":role==="senior"?"Senior · Batch 2025":"Student · Batch 2026"}</div></div>
        </div>
      </div>
    </aside>
  );
}

function App(){
  const [phase, setPhase] = useState("login"); // login | onboarding | app
  const [role, setRole] = useState("student");
  const [screen, setScreen] = useState("dashboard");
  const [screenData, setScreenData] = useState(null);
  const [mobileOpen, setMobileOpen] = useState(false);
  const [saved, setSaved] = useState([1]);

  const nav = (key, data)=>{ setScreen(key); setScreenData(data||null); window.scrollTo(0,0); };
  const toggleSave = (id)=> setSaved(s=> s.includes(id) ? s.filter(x=>x!==id) : [...s, id]);

  if(phase==="login") return <LoginScreen onLogin={()=>setPhase("app")} goRegister={()=>setPhase("onboarding")}/>;
  if(phase==="onboarding") return <OnboardingScreen onDone={()=>{setPhase("app"); setScreen("dashboard");}}/>;

  let body;
  if(role==="student"){
    if(screen==="dashboard") body = <StudentDashboard nav={nav}/>;
    else if(screen==="corres") body = <MyCorresScreen/>;
    else if(screen==="resources") body = <ResourceDirectory nav={nav} saved={saved} toggleSave={toggleSave}/>;
    else if(screen==="resourceDetail") body = <ResourceDetailScreen resource={screenData} nav={nav} saved={saved} toggleSave={toggleSave}/>;
    else if(screen==="upload") body = <UploadResourceScreen nav={nav} role={role}/>;
    else if(screen==="qa") body = <QAScreen nav={nav}/>;
    else if(screen==="question") body = <QuestionDetailScreen question={screenData} nav={nav}/>;
    else if(screen==="chat") body = <ChatScreen/>;
    else if(screen==="lineage") body = <LineageScreen/>;
    else if(screen==="saved") body = <SavedResourcesScreen saved={saved} nav={nav} toggleSave={toggleSave}/>;
    else if(screen==="notifications") body = <NotificationsScreen/>;
    else if(screen==="profile") body = <ProfileScreen role={role}/>;
  } else if(role==="senior"){
    if(screen==="dashboard") body = <SeniorDashboard nav={nav}/>;
    else if(screen==="juniors") body = <MyJuniorsScreen nav={nav}/>;
    else if(screen==="resources") body = <ResourceDirectory nav={nav} saved={saved} toggleSave={toggleSave}/>;
    else if(screen==="resourceDetail") body = <ResourceDetailScreen resource={screenData} nav={nav} saved={saved} toggleSave={toggleSave}/>;
    else if(screen==="upload") body = <UploadResourceScreen nav={nav} role={role}/>;
    else if(screen==="qa") body = <QAScreen nav={nav}/>;
    else if(screen==="question") body = <QuestionDetailScreen question={screenData} nav={nav}/>;
    else if(screen==="chat") body = <ChatScreen/>;
    else if(screen==="contributions") body = <ContributionsScreen/>;
    else if(screen==="notifications") body = <NotificationsScreen/>;
    else if(screen==="profile") body = <ProfileScreen role={role}/>;
  } else {
    if(screen==="dashboard") body = <AdminDashboard/>;
    else if(screen==="users") body = <AdminUsersScreen/>;
    else if(screen==="batches") body = <AdminBatchesScreen/>;
    else if(screen==="assignments") body = <AdminAssignmentsScreen/>;
    else if(screen==="resources") body = <ResourceDirectory nav={nav} saved={saved} toggleSave={toggleSave}/>;
    else if(screen==="resourceDetail") body = <ResourceDetailScreen resource={screenData} nav={nav} saved={saved} toggleSave={toggleSave}/>;
    else if(screen==="moderation") body = <AdminModerationScreen/>;
  }
  if(!body) body = role==="student"?<StudentDashboard nav={nav}/>: role==="senior"?<SeniorDashboard nav={nav}/>:<AdminDashboard/>;

  const mobileNavItems = NAV[role].slice(0,5);

  return (
    <div className="app-shell">
      <Sidebar role={role} screen={screen} setScreen={(k)=>nav(k)} setRole={setRole} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen}/>
      <div className="main-col">
        <div className="topbar">
          <div style={{display:"flex", alignItems:"center", gap:12}}>
            <button className="icon-btn menu-btn" onClick={()=>setMobileOpen(true)}><Icon name="menu"/></button>
            <div className="topbar-title">{TITLES[screen] || "Dashboard"}</div>
          </div>
          <div className="topbar-right">
            <div className="search-bar" style={{width:220, display:window.innerWidth<640?"none":"flex"}}><Icon name="search"/><input placeholder="Search..."/></div>
            <button className="icon-btn" onClick={()=>nav("notifications")}><Icon name="bell"/><span className="dot"/></button>
            <button className="icon-btn" onClick={()=>{setPhase("login");}}><Icon name="logout"/></button>
          </div>
        </div>
        <div className="content">{body}</div>
      </div>
      <div className="bottom-nav">
        {mobileNavItems.map(it=>(
          <button key={it.key} className={screen===it.key?"active":""} onClick={()=>nav(it.key)}><Icon name={it.icon} className="nav-ic"/>{it.label}</button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
